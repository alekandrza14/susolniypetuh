services:
  - type: web
    name: myengine-player-identity
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:application --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 40
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myengine-players
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: phone
      - key: GATEWAY_TOKEN_HASH
        sync: false
      - key: OTP_KEY
        sync: false
      - key: OWNER_PLAYER_ID
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
databases:
  - name: myengine-players
    plan: free
    databaseName: myengine_players
    user: myengine_players
